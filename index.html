<!doctype html><html lang="mr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ज्वारी पीक पडताळणी</title><style>body{font-family:Arial,"Nirmala UI";padding:15px;background:#f3f6f2}.box{max-width:650px;margin:auto;background:white;padding:20px;border-radius:12px}label{display:block;margin-top:12px;font-weight:bold}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin-top:4px;font-size:16px}button{margin-top:18px;background:#1b5e20;color:white;border:0;border-radius:8px}#gps{padding:10px;background:#eef7ee;margin-top:12px}</style>
<body><div class="box"><h2>🌾 ज्वारी पीक पडताळणी</h2>
<label>शेतकऱ्याचे नाव</label><input id="farmer">
<label>गाव</label><select id="village"><option>कोळविहीर</option><option>आष्टोली</option><option>डोमक</option><option>यादवपूर</option></select>
<label>गट / सर्वे नंबर</label><input id="survey"><label>क्षेत्र</label><input id="area"><label>मोबाईल</label><input id="mobile">
<label>ई-पीक पाहणीतील नोंद</label><select id="eCrop"><option>ज्वारी</option><option>इतर</option></select>
<label>प्रत्यक्ष पाहणीतील स्थिती</label><select id="actualStatus"><option>ज्वारीचे पीक प्रत्यक्ष आहे</option><option>ज्वारीचे पीक प्रत्यक्ष नाही</option><option>काढणी झालेले/अवशेष उपलब्ध</option><option>पुढील चौकशी आवश्यक</option></select>
<label>स्थानिक शेतकऱ्यांचे बयान</label><select id="localStatement"><option>होय</option><option>नाही</option></select>
<label>खत/बियाणे पावती पाहिली</label><select id="receiptChecked"><option>होय</option><option>नाही</option></select>
<label>पडताळणी अधिकाऱ्याचे नाव</label><input id="officer"><label>शेरा</label><textarea id="remark"></textarea>
<div id="gps">GPS मिळवत आहे...</div><label>प्रत्यक्ष फोटो</label><input id="photo" type="file" accept="image/*" capture="environment">
<button onclick="send()">Submit</button><p id="msg"></p></div>
<script>
const URL='https://script.google.com/macros/s/AKfycbzKkVvoPwoVlPmEZcOO-2iIPfYewCCVbn3pFy1gXnhoeoEoVtqAoHEQ_Ny4c1znd3Qq/exec';let lat='',lng='',accuracy='';const g=id=>document.getElementById(id);
navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;accuracy=p.coords.accuracy;g('gps').innerHTML='📍 GPS: '+lat+', '+lng;},()=>g('gps').innerHTML='⚠️ GPS Allow करा.',{enableHighAccuracy:true});
function send(){if(!g('farmer').value||!g('survey').value||!g('photo').files[0]||!lat){g('msg').innerText='आवश्यक माहिती/GPS/फोटो तपासा.';return}let f=g('photo').files[0],r=new FileReader();r.onload=async e=>{let d={farmer:g('farmer').value,village:g('village').value,survey:g('survey').value,area:g('area').value,mobile:g('mobile').value,eCrop:g('eCrop').value,actualStatus:g('actualStatus').value,localStatement:g('localStatement').value,receiptChecked:g('receiptChecked').value,officer:g('officer').value,remark:g('remark').value,lat,lng,accuracy,capturedAt:new Date().toISOString(),fileName:f.name,mimeType:f.type,imageBase64:e.target.result.split(',')[1]};let x=await fetch(URL,{method:'POST',body:JSON.stringify(d)});let o=await x.json();g('msg').innerText=o.ok?'✅ नोंद जतन झाली. सारांश आपोआप अपडेट झाला.':'❌ '+o.error};r.readAsDataURL(f)};</script></body></html>

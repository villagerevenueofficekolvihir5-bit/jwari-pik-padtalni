<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ज्वारी पीक पडताळणी</title>

<style>
body{
  font-family:Arial,"Nirmala UI",sans-serif;
  padding:15px;
  background:#f3f6f2;
  margin:0;
}

.box{
  max-width:650px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

h2{
  text-align:center;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input,select,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  margin-top:4px;
  font-size:16px;
  border:1px solid #bbb;
  border-radius:8px;
}

textarea{
  min-height:80px;
}

button{
  margin-top:18px;
  background:#1b5e20;
  color:white;
  border:0;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#gps{
  padding:12px;
  background:#eef7ee;
  margin-top:15px;
  border-radius:8px;
}

#preview{
  width:100%;
  margin-top:12px;
  border-radius:8px;
  display:none;
}

#msg{
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}
</style>

</head>

<body>

<div class="box">

<h2>🌾 ज्वारी पीक पडताळणी</h2>

<label>शेतकऱ्याचे नाव *</label>
<input id="farmer" placeholder="शेतकऱ्याचे पूर्ण नाव">

<label>गाव *</label>
<select id="village">
  <option value="">-- गाव निवडा --</option>
  <option value="कोळविहीर">कोळविहीर</option>
  <option value="आष्टोली">आष्टोली</option>
  <option value="डोमक">डोमक</option>
  <option value="यादवपूर">यादवपूर</option>
</select>

<label>गट / सर्वे नंबर *</label>
<input id="survey" placeholder="उदा. 46/1/अ">

<label>क्षेत्र</label>
<input id="area">

<label>मोबाईल नंबर</label>
<input id="mobile" type="tel" inputmode="numeric">

<label>ई-पीक पाहणीतील नोंद *</label>
<select id="eCrop">
  <option value="">-- निवडा --</option>
  <option value="ज्वारी">ज्वारी</option>
  <option value="इतर">इतर</option>
</select>

<label>प्रत्यक्ष पाहणीतील स्थिती *</label>
<select id="actualStatus">
  <option value="">-- निवडा --</option>
  <option value="ज्वारीचे पीक प्रत्यक्ष आहे">ज्वारीचे पीक प्रत्यक्ष आहे</option>
  <option value="ज्वारीचे पीक प्रत्यक्ष नाही">ज्वारीचे पीक प्रत्यक्ष नाही</option>
  <option value="काढणी झालेले/अवशेष उपलब्ध">काढणी झालेले / अवशेष उपलब्ध</option>
  <option value="पुढील चौकशी आवश्यक">पुढील चौकशी आवश्यक</option>
</select>

<label>स्थानिक शेतकऱ्यांचे बयान</label>
<select id="localStatement">
  <option value="होय">होय</option>
  <option value="नाही">नाही</option>
</select>

<label>खत / बियाणे पावती पाहिली</label>
<select id="receiptChecked">
  <option value="होय">होय</option>
  <option value="नाही">नाही</option>
</select>

<label>पडताळणी अधिकाऱ्याचे नाव</label>
<input id="officer">

<label>शेरा</label>
<textarea id="remark"></textarea>

<div id="gps">
📍 GPS मिळवत आहे...
</div>

<button type="button" onclick="getGPS()">
📍 GPS पुन्हा मिळवा
</button>

<label>📷 प्रत्यक्ष फोटो *</label>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment">

<img id="preview">

<button
  type="button"
  id="submitBtn"
  onclick="send()">

✅ Submit करा

</button>

<p id="msg"></p>

</div>

<script>

/* =====================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================== */

const URL =
'https://script.google.com/macros/s/AKfycbzKkVvoPwoVlPmEZcOO-2iIPfYewCCVbn3pFy1gXnhoeoEoVtqAoHEQ_Ny4c1znd3Qq/exec';


let lat = '';
let lng = '';
let accuracy = '';

const g = id => document.getElementById(id);


/* =====================================
   GPS
===================================== */

function getGPS(){

  g('gps').innerHTML =
    '⏳ GPS Location मिळवत आहे...';

  if(!navigator.geolocation){

    g('gps').innerHTML =
      '❌ या Browser मध्ये GPS उपलब्ध नाही.';

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      lat = position.coords.latitude;
      lng = position.coords.longitude;
      accuracy = position.coords.accuracy;

      g('gps').innerHTML =
        '✅ GPS मिळाले<br><br>' +
        'Latitude: ' + lat + '<br>' +
        'Longitude: ' + lng + '<br>' +
        'Accuracy: ' + Math.round(accuracy) + ' मीटर';

    },

    function(error){

      let errorMessage = '';

      if(error.code === 1){
        errorMessage = '❌ Location Permission Denied';
      }
      else if(error.code === 2){
        errorMessage = '❌ GPS Location उपलब्ध नाही';
      }
      else if(error.code === 3){
        errorMessage = '❌ GPS मिळण्यासाठी वेळ संपला';
      }
      else{
        errorMessage = '❌ GPS Error';
      }

      g('gps').innerHTML =
        errorMessage +
        '<br><br>मोबाईल Location ON करा आणि GPS पुन्हा मिळवा बटन दाबा.';

    },

    {
      enableHighAccuracy:true,
      timeout:30000,
      maximumAge:0
    }

  );

}


/* PAGE उघडल्यावर GPS */

getGPS();


/* =====================================
   PHOTO PREVIEW
===================================== */

g('photo').addEventListener('change', function(){

  const file = g('photo').files[0];

  if(!file){
    return;
  }

  /* 5 MB पेक्षा मोठा फोटो */

  if(file.size > 5 * 1024 * 1024){

    g('msg').innerHTML =
      '⚠️ फोटोचा आकार 5 MB पेक्षा जास्त आहे. कृपया कमी आकाराचा फोटो घ्या.';

    g('photo').value = '';

    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    g('preview').src = e.target.result;

    g('preview').style.display = 'block';

  };

  reader.readAsDataURL(file);

});


/* =====================================
   SUBMIT
===================================== */

async function send(){

  let errors = [];

  if(!g('farmer').value.trim()){
    errors.push('शेतकऱ्याचे नाव');
  }

  if(!g('village').value){
    errors.push('गाव');
  }

  if(!g('survey').value.trim()){
    errors.push('गट / सर्वे नंबर');
  }

  if(!g('eCrop').value){
    errors.push('ई-पीक नोंद');
  }

  if(!g('actualStatus').value){
    errors.push('प्रत्यक्ष पाहणीतील स्थिती');
  }

  if(!g('photo').files[0]){
    errors.push('प्रत्यक्ष फोटो');
  }

  if(!lat || !lng){
    errors.push('GPS Location');
  }

  if(errors.length > 0){

    g('msg').innerHTML =
      '⚠️ खालील माहिती आवश्यक आहे:<br><br>' +
      errors.map(x => '❌ ' + x).join('<br>');

    return;
  }


  const f = g('photo').files[0];

  const reader = new FileReader();

  g('submitBtn').disabled = true;

  g('msg').innerHTML =
    '⏳ माहिती आणि फोटो अपलोड होत आहे...';


  reader.onload = async function(e){

    const data = {

      farmer: g('farmer').value,
      village: g('village').value,
      survey: g('survey').value,
      area: g('area').value,
      mobile: g('mobile').value,

      eCrop: g('eCrop').value,

      actualStatus: g('actualStatus').value,

      localStatement: g('localStatement').value,

      receiptChecked: g('receiptChecked').value,

      officer: g('officer').value,

      remark: g('remark').value,

      lat: lat,
      lng: lng,
      accuracy: accuracy,

      capturedAt: new Date().toISOString(),

      fileName: f.name,

      mimeType: f.type,

      imageBase64:
        e.target.result.split(',')[1]

    };


    try{

      const response = await fetch(URL, {

        method: 'POST',

        redirect: 'follow',

        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },

        body: JSON.stringify(data)

      });


      const text = await response.text();

      let result;

      try{

        result = JSON.parse(text);

      }
      catch(parseError){

        throw new Error(
          'Server कडून योग्य प्रतिसाद मिळाला नाही.'
        );

      }


      if(result.ok){

        g('msg').innerHTML =
          '✅ <b>नोंद यशस्वीरित्या जतन झाली!</b><br>' +
          'Google Sheet आणि Drive मध्ये माहिती सेव्ह झाली आहे.';

      }

      else{

        g('msg').innerHTML =
          '❌ Server Error: ' +
          (result.error || 'Unknown Error');

      }

    }

    catch(error){

      console.error(error);

      g('msg').innerHTML =
        '❌ Upload Error: ' +
        error.message +
        '<br><br>' +
        'Apps Script Web App Deployment तपासा.';

    }

    g('submitBtn').disabled = false;

  };


  reader.readAsDataURL(f);

}

</script>

</body>
</html>

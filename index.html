<!DOCTYPE html>
<html lang="mr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ज्वारी पीक पडताळणी</title>

<style>

body{
  font-family:Arial,"Nirmala UI",sans-serif;
  padding:15px;
  background:#f3f6f2;
  margin:0;
}

.box{
  max-width:650px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
  text-align:center;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input,select,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  margin-top:4px;
  font-size:16px;
  border:1px solid #bbb;
  border-radius:8px;
}

textarea{
  min-height:80px;
}

button{
  margin-top:18px;
  background:#1b5e20;
  color:white;
  border:0;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#gps{
  padding:12px;
  background:#eef7ee;
  margin-top:15px;
  border-radius:8px;
}

#preview{
  width:100%;
  margin-top:12px;
  border-radius:8px;
  display:none;
  max-height:500px;
  object-fit:cover;
}

#msg{
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}

</style>

</head>

<body>

<div class="box">

<h2>🌾 ज्वारी पीक पडताळणी</h2>

<label>शेतकऱ्याचे नाव *</label>
<input id="farmer" placeholder="शेतकऱ्याचे पूर्ण नाव">

<label>गाव *</label>

<select id="village">
  <option value="">-- गाव निवडा --</option>
  <option value="कोळविहीर">कोळविहीर</option>
  <option value="आष्टोली">आष्टोली</option>
  <option value="डोमक">डोमक</option>
  <option value="यादवपूर">यादवपूर</option>
</select>

<label>गट / सर्वे नंबर *</label>
<input id="survey" placeholder="उदा. 46/1/अ">

<label>क्षेत्र</label>
<input id="area">

<label>मोबाईल नंबर</label>
<input id="mobile" type="tel" inputmode="numeric">

<label>ई-पीक पाहणीतील नोंद *</label>

<select id="eCrop">
  <option value="">-- निवडा --</option>
  <option value="ज्वारी">ज्वारी</option>
  <option value="इतर">इतर</option>
</select>

<label>प्रत्यक्ष पाहणीतील स्थिती *</label>

<select id="actualStatus">

  <option value="">-- निवडा --</option>

  <option value="ज्वारीचे पीक प्रत्यक्ष आहे">
    ज्वारीचे पीक प्रत्यक्ष आहे
  </option>

  <option value="ज्वारीचे पीक प्रत्यक्ष नाही">
    ज्वारीचे पीक प्रत्यक्ष नाही
  </option>

  <option value="काढणी झालेले/अवशेष उपलब्ध">
    काढणी झालेले / अवशेष उपलब्ध
  </option>

  <option value="पुढील चौकशी आवश्यक">
    पुढील चौकशी आवश्यक
  </option>

</select>

<label>स्थानिक शेतकऱ्यांचे बयान</label>

<select id="localStatement">
  <option value="होय">होय</option>
  <option value="नाही">नाही</option>
</select>

<label>खत / बियाणे पावती पाहिली</label>

<select id="receiptChecked">
  <option value="होय">होय</option>
  <option value="नाही">नाही</option>
</select>

<label>पडताळणी अधिकाऱ्याचे नाव</label>
<input id="officer">

<label>शेरा</label>
<textarea id="remark"></textarea>


<div id="gps">
📍 GPS मिळवत आहे...
</div>

<button type="button" onclick="getGPS()">
📍 GPS पुन्हा मिळवा
</button>


<label>📷 प्रत्यक्ष फोटो *</label>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment">

<img id="preview">


<button
  type="button"
  id="submitBtn"
  onclick="send()">

✅ Submit करा

</button>

<p id="msg"></p>

</div>


<script>

/* =====================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================== */

const URL =
'https://script.google.com/macros/s/AKfycbzKkVvoPwoVlPmEZcOO-2iIPfYewCCVbn3pFy1gXnhoeoEoVtqAoHEQ_Ny4c1znd3Qq/exec';


let lat = '';
let lng = '';
let accuracy = '';

const g = id => document.getElementById(id);


/* =====================================
   GPS
===================================== */

function getGPS(){

  g('gps').innerHTML =
    '⏳ GPS Location मिळवत आहे...';

  if(!navigator.geolocation){

    g('gps').innerHTML =
      '❌ या Browser मध्ये GPS उपलब्ध नाही.';

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      lat = position.coords.latitude;
      lng = position.coords.longitude;
      accuracy = position.coords.accuracy;

      g('gps').innerHTML =
        '✅ GPS मिळाले<br><br>' +
        'Latitude: ' + lat + '<br>' +
        'Longitude: ' + lng + '<br>' +
        'Accuracy: ' +
        Math.round(accuracy) +
        ' मीटर';

    },

    function(){

      g('gps').innerHTML =
        '❌ GPS मिळाले.<br><br>' +
        'मोबाईल Location ON करा आणि GPS पुन्हा मिळवा बटन दाबा.';

    },

    {
      enableHighAccuracy:true,
      timeout:30000,
      maximumAge:0
    }

  );

}


/* PAGE उघडल्यावर GPS */

getGPS();


/* =====================================
   PHOTO PREVIEW
===================================== */

g('photo').addEventListener('change', function(){

  const file = g('photo').files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    g('preview').src = e.target.result;
    g('preview').style.display = 'block';

  };

  reader.readAsDataURL(file);

});


/* =====================================
   DATE / TIME FORMAT
===================================== */

function getDateTime(){

  const now = new Date();

  return now.toLocaleString(
    'en-GB',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',
      hour12:false
    }
  );

}


/* =====================================
   फोटोवर GPS + शेतकरी माहिती
===================================== */

function createStampedImage(file){

  return new Promise(function(resolve,reject){

    const reader = new FileReader();

    reader.onload = function(event){

      const img = new Image();

      img.onload = function(){

        const canvas =
          document.createElement('canvas');

        let width = img.width;
        let height = img.height;

        const MAX_WIDTH = 1600;

        if(width > MAX_WIDTH){

          height =
            Math.round(
              height * MAX_WIDTH / width
            );

          width = MAX_WIDTH;

        }

        const fontSize =
          Math.max(
            22,
            Math.round(width / 38)
          );

        const lineHeight =
          Math.round(fontSize * 1.45);

        const padding =
          Math.round(fontSize * 0.8);

        const infoHeight =
          lineHeight * 5 +
          padding * 2;

        canvas.width = width;

        canvas.height =
          height + infoHeight;

        const ctx =
          canvas.getContext('2d');


        /* मूळ फोटो */

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        /* खाली काळी माहिती पट्टी */

        ctx.fillStyle =
          'rgba(0,0,0,0.78)';

        ctx.fillRect(
          0,
          height,
          width,
          infoHeight
        );


        ctx.fillStyle = 'white';

        ctx.font =
          'bold ' +
          fontSize +
          'px Arial, sans-serif';


        const farmer =
          g('farmer').value.trim();

        const village =
          g('village').value;

        const survey =
          g('survey').value.trim();

        const dateTime =
          getDateTime();


        const gpsText =
          'GPS: ' +
          Number(lat).toFixed(6) +
          ', ' +
          Number(lng).toFixed(6);


        const accuracyText =
          'Accuracy: ' +
          Math.round(accuracy) +
          ' meters';


        let y =
          height +
          padding +
          fontSize;


        ctx.fillText(
          'शेतकरी: ' + farmer,
          padding,
          y
        );


        y += lineHeight;

        ctx.fillText(
          'गाव: ' + village +
          ' | सर्वे नं.: ' + survey,
          padding,
          y
        );


        y += lineHeight;

        ctx.fillText(
          gpsText,
          padding,
          y
        );


        y += lineHeight;

        ctx.fillText(
          accuracyText,
          padding,
          y
        );


        y += lineHeight;

        ctx.fillText(
          'दिनांक व वेळ: ' + dateTime,
          padding,
          y
        );


        const stampedImage =
          canvas.toDataURL(
            'image/jpeg',
            0.82
          );

        resolve(stampedImage);

      };


      img.onerror = reject;

      img.src = event.target.result;

    };


    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* =====================================
   सुरक्षित File Name
===================================== */

function safeName(text){

  return String(text || '')
    .trim()
    .replace(/[\\/:*?"<>|]/g,'_')
    .replace(/\s+/g,'_');

}


/* =====================================
   FORM RESET
===================================== */

function resetForm(){

  g('farmer').value = '';
  g('village').value = '';
  g('survey').value = '';
  g('area').value = '';
  g('mobile').value = '';
  g('eCrop').value = '';
  g('actualStatus').value = '';
  g('localStatement').value = 'होय';
  g('receiptChecked').value = 'होय';
  g('officer').value = '';
  g('remark').value = '';
  g('photo').value = '';

  g('preview').src = '';
  g('preview').style.display = 'none';

}


/* =====================================
   SUBMIT
===================================== */

async function send(){

  let errors = [];


  if(!g('farmer').value.trim()){
    errors.push('शेतकऱ्याचे नाव');
  }

  if(!g('village').value){
    errors.push('गाव');
  }

  if(!g('survey').value.trim()){
    errors.push('गट / सर्वे नंबर');
  }

  if(!g('eCrop').value){
    errors.push('ई-पीक नोंद');
  }

  if(!g('actualStatus').value){
    errors.push('प्रत्यक्ष पाहणीतील स्थिती');
  }

  if(!g('photo').files[0]){
    errors.push('प्रत्यक्ष फोटो');
  }

  if(!lat || !lng){
    errors.push('GPS Location');
  }


  if(errors.length > 0){

    g('msg').innerHTML =
      '⚠️ खालील माहिती आवश्यक आहे:<br><br>' +
      errors
        .map(x => '❌ ' + x)
        .join('<br>');

    return;

  }


  const f =
    g('photo').files[0];

  const farmer =
    g('farmer').value.trim();

  const village =
    g('village').value;

  const survey =
    g('survey').value.trim();


  g('submitBtn').disabled = true;

  /* Submit करताना कोणताही अनावश्यक मेसेज नाही */

  g('msg').innerHTML = '';


  try{


    /* फोटोवर GPS व माहिती लिहा */

    const imageData =
      await createStampedImage(f);


    /* फोटोचे नाव */

    const fileName =
      'JWARI_' +
      safeName(farmer) +
      '_' +
      safeName(village) +
      '_' +
      safeName(survey) +
      '_' +
      Date.now() +
      '.jpg';


    const data = {

      farmer: farmer,

      village: village,

      survey: survey,

      area:
        g('area').value.trim(),

      mobile:
        g('mobile').value.trim(),

      eCrop:
        g('eCrop').value,

      actualStatus:
        g('actualStatus').value,

      localStatement:
        g('localStatement').value,

      receiptChecked:
        g('receiptChecked').value,

      officer:
        g('officer').value.trim(),

      remark:
        g('remark').value.trim(),

      lat: lat,

      lng: lng,

      accuracy: accuracy,

      capturedAt:
        new Date().toISOString(),

      fileName:
        fileName,

      mimeType:
        'image/jpeg',

      imageBase64:
        imageData.split(',')[1]

    };


    /* GOOGLE APPS SCRIPT ला SEND */

    await fetch(

      URL,

      {

        method:'POST',

        mode:'no-cors',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(data)

      }

    );


    /* SUCCESS - फक्त हाच मेसेज */

    g('msg').innerHTML =
      '✅ माहिती यशस्वीरित्या साठविण्यात आली!';


    /* FORM RESET */

    resetForm();


    /* नवीन GPS */

    lat = '';
    lng = '';
    accuracy = '';

    getGPS();


  }

  catch(error){

    console.error(error);

    g('msg').innerHTML =
      '❌ माहिती साठविताना त्रुटी आली. कृपया पुन्हा प्रयत्न करा.';

  }


  g('submitBtn').disabled = false;

}

</script>

</body>
</html>
